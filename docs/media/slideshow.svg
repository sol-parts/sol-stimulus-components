<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="slideshow — looping slideshow Stimulus controller">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="slide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="14" fill="url(#bg)"/>
  <circle cx="530" cy="20" r="130" fill="#ffffff" opacity="0.03"/>
  <circle cx="60" cy="330" r="100" fill="#ffffff" opacity="0.04"/>

  <text x="44" y="52" font-family="ui-monospace, monospace" font-size="14" fill="#a5b4fc" letter-spacing="1">&lt;div data-controller="slideshow"&gt;</text>

  <g transform="translate(84, 76)">
    <!-- edge clones -->
    <rect x="-32" y="20" width="24" height="140" rx="7" fill="url(#edge)" opacity="0.35"/>
    <rect x="440" y="20" width="24" height="140" rx="7" fill="url(#edge)" opacity="0.55"/>
    <!-- current slide -->
    <rect x="0" y="0" width="432" height="180" rx="10" fill="url(#slide)"/>
    <text x="216" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="700" fill="#ffffff" opacity="0.9" text-anchor="middle">2</text>

    <!-- arrows -->
    <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <path d="M 26 90 l 12 -12 m -12 12 l 12 12"/>
      <path d="M 406 90 l -12 -12 m 12 12 l -12 12"/>
    </g>

    <!-- pagination -->
    <g transform="translate(180, 204)">
      <circle cx="0" cy="0" r="4.5" fill="#ffffff" opacity="0.35"/>
      <circle cx="22" cy="0" r="5.5" fill="#e879f9"/>
      <circle cx="44" cy="0" r="4.5" fill="#ffffff" opacity="0.35"/>
      <circle cx="66" cy="0" r="4.5" fill="#ffffff" opacity="0.35"/>
    </g>
  </g>

  <text x="44" y="312" font-family="ui-monospace, monospace" font-size="14" fill="#818cf8">slideshow</text>
  <text x="126" y="312" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#94a3b8">· loop · autoplay · pagination · aspect-ratio</text>
</svg>
